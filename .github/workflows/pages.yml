name: Package Pulse · Check and publish
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * 2'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh retained default packages
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: packagepulse-build-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 15
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh retained default packages
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_data)
        run: node scripts/refresh.mjs
      - name: Test the application
        run: node --test tests/*.test.mjs
      - name: Test the builder
        run: python3 -m unittest discover -s tests -v
      - name: Build the static application
        run: python3 scripts/build.py
      - name: Check whether the tool has been initialized
        id: identity
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PY'
          import json, os
          tool_id = json.load(open('tool.json'))['id']
          ready = tool_id != 'coolcode-tool-template' and tool_id == os.environ['REPOSITORY_NAME']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(ready).lower()}\n')
          PY
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check application in a browser
        run: python3 tests/browser_smoke.py
      - name: Commit validated default capture
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_data)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/defaults.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated package defaults'
            git push
          fi
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Save reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: browser-tool-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
      - name: Package Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.identity.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
